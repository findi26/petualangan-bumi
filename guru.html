<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Lapisan Bumi - Guru & Siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#87CEEB; --grass:#7BC96F; --crust:#C68642; --mantle:#FF8C42;
    --outer:#FF4E3A; --inner:#FFD93D; --purple:#9B5DE5; --purple-dark:#7A3FC4;
    --gold:#FFCC00; --ink:#4A2C00; --cream:#FFF8ED; --ok:#4CC38A; --bad:#FF6B5E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Fredoka','Baloo 2',system-ui,'Segoe UI',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#B8E6FF 0%,#87CEEB 45%,#9BE0A8 100%);
    min-height:100vh;
  }
  .app{max-width:1100px;margin:0 auto;padding:16px;}
  .card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 0 #D9C8B0,0 10px 18px rgba(0,0,0,.08);margin-bottom:16px;}
  .btn{font-family:inherit;font-weight:600;font-size:1rem;border:none;cursor:pointer;border-radius:16px;padding:10px 18px;transition:transform .12s,box-shadow .12s;color:#fff;background:var(--purple);box-shadow:0 4px 0 var(--purple-dark);}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-dark);}
  .btn-green{background:var(--ok);box-shadow:0 4px 0 #339E6C;}
  .btn-red{background:var(--bad);box-shadow:0 4px 0 #C0392B;}
  .btn-ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #D9C8B0;}
  .btn-sm{font-size:.85rem;padding:6px 12px;border-radius:12px;}
  .input,.textarea,.select{width:100%;font-family:inherit;font-size:1rem;padding:10px 12px;border:2px solid #E4D5C0;border-radius:12px;background:#FFF8ED;color:var(--ink);}
  .textarea{min-height:80px;resize:vertical;}
  .label{font-weight:600;font-size:.9rem;margin-bottom:4px;display:block;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .topbar h1{margin:0;font-size:1.5rem;flex:1;color:#fff;text-shadow:0 2px 0 #5B3A99;}
  .badge{background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem;box-shadow:0 3px 0 #D9C8B0;}
  .sidebar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:8px 14px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:.9rem;background:#fff;color:var(--ink);box-shadow:0 3px 0 #D9C8B0;}
  .tab.active{background:var(--purple);color:#fff;}
  .item{background:#FFF8ED;border-radius:14px;padding:12px;margin-bottom:10px;border:2px solid #E4D5C0;}
  .item h3{margin:0 0 4px;font-size:1.05rem;}
  .item p{margin:0;font-size:.9rem;opacity:.8;}
  .thumb{width:100%;max-height:260px;object-fit:contain;background:#FFF8ED;border-radius:12px;border:2px solid #E4D5C0;margin-top:8px;}
  .hidden{display:none !important;}
  .empty{text-align:center;opacity:.6;padding:20px;}
  .score{font-size:2rem;font-weight:700;color:var(--purple);}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:20px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 0 #D9C8B0;}
  .login-box{max-width:420px;margin:60px auto;}
  .earth-svg{width:100%;max-width:360px;margin:0 auto;display:block;}
  .role-btn{display:flex;align-items:center;gap:12px;padding:18px;border-radius:18px;border:3px solid #fff;cursor:pointer;background:#fff;box-shadow:0 6px 0 #D9C8B0;transition:transform .12s;}
  .role-btn:active{transform:translateY(4px);}
  .role-btn .ico{font-size:2.2rem;}
  .role-btn h3{margin:0;font-size:1.1rem;}
  .role-btn p{margin:0;font-size:.85rem;opacity:.7;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   STATE & STORAGE
   ============================================================ */
const KEY = 'edugame-dashboard-v1';
const DEFAULT = {
  role: null,
  guruPin: '1234',
  siswaName: '',
  materi: [],
  soal: [],
  gambarBumi: {},
  progress: []
};
let state = load();
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'{}'); return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), s); }catch(e){ return JSON.parse(JSON.stringify(DEFAULT)); } }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================================================
   EARTH SVG (default illustration)
   ============================================================ */
function earthSVG(size=260){
  return `<img src="earth.png" alt="Bumi" style="width:100%;max-width:${size}px;border-radius:16px;border:2px solid #E4D5C0;" />`; } // original SVG archived below
/* function earthSVG(size=260){ return `<svg class="earth-svg" viewBox="0 0 320 400" width="${size}" height="${size*1.25}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g0" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#B8E6FF"/><stop offset="100%" stop-color="#87CEEB"/></radialGradient>
    </defs>
    <rect width="320" height="400" fill="url(#g0)" rx="20"/>
    <text x="160" y="30" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="16" fill="#4A2C00">LAPISAN BUMI</text>
    <g transform="translate(160,210)">
      <circle r="135" fill="#7BC96F"/>
      <circle r="120" fill="#C68642"/>
      <circle r="80" fill="#FF8C42"/>
      <circle r="48" fill="#FF4E3A"/>
      <circle r="22" fill="#FFD93D"/>
      <circle r="120" fill="none" stroke="#5FA84F" stroke-width="4"/>
      <text x="0" y="-100" text-anchor="middle" font-size="11" font-weight="700" fill="#3C2A12">Kerak</text>
      <text x="0" y="-55" text-anchor="middle" font-size="11" font-weight="700" fill="#3C2A12">Mantel</text>
      <text x="0" y="-20" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Inti Luar</text>
      <text x="0" y="6" text-anchor="middle" font-size="9" font-weight="700" fill="#4A2C00">Inti Dalam</text>
    </g>
    <text x="160" y="385" text-anchor="middle" font-size="10" fill="#7A5A30">Gambar default (ganti di halaman Guru)</text>
  </svg>`;
}
*/

const LAYERS = ['Kerak Bumi','Mantel','Inti Luar','Inti Dalam'];

/* ============================================================
   RENDER ROOT
   ============================================================ */
const app = document.getElementById('app');
function render(){
  if(!state.role){ renderLogin(); return; }
  if(state.role==='guru'){ renderGuru(); return; }
  renderSiswa();
}
function renderLogin(){
  app.innerHTML = `
    <div class="login-box">
      <div class="card" style="text-align:center;">
        <h1 style="color:var(--purple);text-shadow:none;margin:0 0 6px;">Dashboard Lapisan Bumi</h1>
        <p style="opacity:.7;margin:0 0 20px;">Pilih peran untuk masuk</p>
        <div class="row" style="justify-content:center;">
          <button class="role-btn" id="btnGuru"><span class="ico">👩‍🏫</span><div><h3>Guru</h3><p>Kelola materi, soal, gambar</p></div></button>
          <button class="role-btn" id="btnSiswa"><span class="ico">🎒</span><div><h3>Siswa</h3><p>Belajar & kuis</p></div></button>
        </div>
      </div>
    </div>`;
  document.getElementById('btnGuru').onclick = ()=>{ const pin=prompt('Masukkan PIN Guru (default 1234):'); if(pin===null) return; if(pin!==state.guruPin){ alert('PIN salah'); return; } state.role='guru'; save(); render(); };
  document.getElementById('btnSiswa').onclick = ()=>{ const name=prompt('Nama siswa:'); if(!name) return; state.siswaName=name; state.role='siswa'; save(); render(); };
}

/* ============================================================
   GURU
   ============================================================ */
let guruTab = 'materi';
function renderGuru(){
  app.innerHTML = `
    <div class="topbar">
      <h1>👩‍🏫 Dashboard Guru</h1>
      <span class="badge">Guru</span>
      <a class="btn btn-sm btn-ghost" href="./index.html">🎮 Game</a>
      <button class="btn btn-sm btn-ghost" id="btnLogout">Keluar</button>
    </div>
    <div class="sidebar">
      <button class="tab ${guruTab==='materi'?'active':''}" data-tab="materi">📚 Materi</button>
      <button class="tab ${guruTab==='soal'?'active':''}" data-tab="soal">❓ Bank Soal</button>
      <button class="tab ${guruTab==='gambar'?'active':''}" data-tab="gambar">🌍 Gambar Bumi</button>
      <button class="tab ${guruTab==='set'?'active':''}" data-tab="set">⚙️ Pengaturan</button>
    </div>
    <div id="guruContent"></div>`;
  document.getElementById('btnLogout').onclick = ()=>{ state.role=null; save(); render(); };
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ guruTab=t.dataset.tab; renderGuru(); });
  const c = document.getElementById('guruContent');
  if(guruTab==='materi') renderGuruMateri(c);
  else if(guruTab==='soal') renderGuruSoal(c);
  else if(guruTab==='gambar') renderGuruGambar(c);
  else renderGuruSet(c);
}

function renderGuruMateri(c){
  c.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2 style="margin:0;">📚 Materi</h2>
        <button class="btn btn-sm btn-green" id="btnAddMateri">+ Tambah Materi</button>
      </div>
      <div id="materiList" style="margin-top:12px;"></div>
    </div>`;
  const list = document.getElementById('materiList');
  if(state.materi.length===0){ list.innerHTML='<div class="empty">Belum ada materi. Klik "Tambah Materi".</div>'; }
  else state.materi.forEach(m=>{
    const div=document.createElement('div'); div.className='item';
    div.innerHTML = `<h3>${escapeHtml(m.title)}</h3><p>Lapisan: ${escapeHtml(m.layer)} · ${escapeHtml(m.desc||'')}</p>${m.image?`<img class="thumb" src="${m.image}" alt="">`:''}
      <div class="row" style="margin-top:8px;">
        <button class="btn btn-sm btn-ghost" data-edit="${m.id}">Edit</button>
        <button class="btn btn-sm btn-red" data-del="${m.id}">Hapus</button>
      </div>`;
    list.appendChild(div);
  });
  document.getElementById('btnAddMateri').onclick = ()=>openMateriForm();
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openMateriForm(b.dataset.edit));
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Hapus materi ini?')){ state.materi=state.materi.filter(m=>m.id!==b.dataset.del); save(); renderGuru(); } });
}

function openMateriForm(editId){
  const m = editId ? state.materi.find(x=>x.id===editId) : {title:'',layer:LAYERS[0],desc:'',image:''};
  const modal = document.createElement('div'); modal.className='modal-back';
  modal.innerHTML = `<div class="modal">
    <h2 style="margin:0 0 12px;">${editId?'Edit':'Tambah'} Materi</h2>
    <label class="label">Judul</label>
    <input class="input" id="mTitle" value="${escapeAttr(m.title)}">
    <label class="label" style="margin-top:8px;">Lapisan</label>
    <select class="select" id="mLayer">${LAYERS.map(l=>`<option ${l===m.layer?'selected':''}>${l}</option>`).join('')}</select>
    <label class="label" style="margin-top:8px;">Deskripsi</label>
    <textarea class="textarea" id="mDesc">${escapeHtml(m.desc||'')}</textarea>
    <label class="label" style="margin-top:8px;">Gambar (opsional)</label>
    <input type="file" accept="image/*" id="mImg">
    ${m.image?`<img class="thumb" src="${m.image}" alt="">`:''}
    <div class="row" style="margin-top:12px;justify-content:flex-end;">
      <button class="btn btn-ghost" id="mCancel">Batal</button>
      <button class="btn btn-green" id="mSave">Simpan</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('mCancel').onclick=()=>modal.remove();
  document.getElementById('mImg').onchange = (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ m.image=r.result; modal.querySelector('img.thumb')?.remove(); const img=document.createElement('img'); img.className='thumb'; img.src=r.result; modal.querySelector('.modal').insertBefore(img, modal.querySelector('.row')); }; r.readAsDataURL(f);
  };
  document.getElementById('mSave').onclick=()=>{
    const title=document.getElementById('mTitle').value.trim();
    if(!title){ alert('Judul wajib'); return; }
    const data={id: m.id||uid(), title, layer:document.getElementById('mLayer').value, desc:document.getElementById('mDesc').value.trim(), image: m.image||''};
    if(editId){ const i=state.materi.findIndex(x=>x.id===editId); state.materi[i]=data; }
    else state.materi.push(data);
    save(); modal.remove(); renderGuru();
  };
}

function renderGuruSoal(c){
  c.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2 style="margin:0;">❓ Bank Soal</h2>
        <button class="btn btn-sm btn-green" id="btnAddSoal">+ Tambah Soal</button>
      </div>
      <div id="soalList" style="margin-top:12px;"></div>
    </div>`;
  const list=document.getElementById('soalList');
  if(state.soal.length===0){ list.innerHTML='<div class="empty">Belum ada soal. Klik "Tambah Soal".</div>'; }
  else state.soal.forEach(s=>{
    const div=document.createElement('div'); div.className='item';
    div.innerHTML = `<h3>${escapeHtml(s.question)}</h3><p>Lapisan: ${escapeHtml(s.layer)} · Jawaban: ${escapeHtml(s.options[s.answer])}</p>${s.image?`<img class="thumb" src="${s.image}" alt="">`:''}
      <div class="row" style="margin-top:8px;">
        <button class="btn btn-sm btn-ghost" data-edit="${s.id}">Edit</button>
        <button class="btn btn-sm btn-red" data-del="${s.id}">Hapus</button>
      </div>`;
    list.appendChild(div);
  });
  document.getElementById('btnAddSoal').onclick=()=>openSoalForm();
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openSoalForm(b.dataset.edit));
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Hapus soal ini?')){ state.soal=state.soal.filter(s=>s.id!==b.dataset.del); save(); renderGuru(); } });
}

function openSoalForm(editId){
  const s = editId ? state.soal.find(x=>x.id===editId) : {question:'',options:['','','',''],answer:0,layer:LAYERS[0],image:''};
  const modal=document.createElement('div'); modal.className='modal-back';
  modal.innerHTML = `<div class="modal">
    <h2 style="margin:0 0 12px;">${editId?'Edit':'Tambah'} Soal</h2>
    <label class="label">Pertanyaan</label>
    <textarea class="textarea" id="sQ">${escapeHtml(s.question)}</textarea>
    <label class="label" style="margin-top:8px;">Lapisan</label>
    <select class="select" id="sLayer">${LAYERS.map(l=>`<option ${l===s.layer?'selected':''}>${l}</option>`).join('')}</select>
    <label class="label" style="margin-top:8px;">Opsi (4)</label>
    ${[0,1,2,3].map(i=>`<input class="input" id="sOpt${i}" placeholder="Opsi ${i+1}" value="${escapeAttr(s.options[i]||'')}" style="margin-bottom:6px;">`).join('')}
    <label class="label" style="margin-top:8px;">Jawaban Benar</label>
    <select class="select" id="sAns">${[0,1,2,3].map(i=>`<option value="${i}" ${i===s.answer?'selected':''}>Opsi ${i+1}</option>`).join('')}</select>
    <label class="label" style="margin-top:8px;">Gambar (opsional)</label>
    <input type="file" accept="image/*" id="sImg">
    ${s.image?`<img class="thumb" src="${s.image}" alt="">`:''}
    <div class="row" style="margin-top:12px;justify-content:flex-end;">
      <button class="btn btn-ghost" id="sCancel">Batal</button>
      <button class="btn btn-green" id="sSave">Simpan</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  let img = s.image||'';
  document.getElementById('sCancel').onclick=()=>modal.remove();
  document.getElementById('sImg').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ img=r.result; const old=modal.querySelector('img.thumb'); if(old) old.remove(); const im=document.createElement('img'); im.className='thumb'; im.src=r.result; modal.querySelector('.modal').insertBefore(im, modal.querySelector('.row')); }; r.readAsDataURL(f);
  };
  document.getElementById('sSave').onclick=()=>{
    const q=document.getElementById('sQ').value.trim();
    const opts=[0,1,2,3].map(i=>document.getElementById('sOpt'+i).value.trim());
    if(!q || opts.some(o=>!o)){ alert('Pertanyaan dan semua opsi wajib diisi'); return; }
    const data={id:s.id||uid(), question:q, options:opts, answer:parseInt(document.getElementById('sAns').value), layer:document.getElementById('sLayer').value, image:img};
    if(editId){ const i=state.soal.findIndex(x=>x.id===editId); state.soal[i]=data; }
    else state.soal.push(data);
    save(); modal.remove(); renderGuru();
  };
}

function renderGuruGambar(c){
  c.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 12px;">🌍 Gambar Bumi per Lapisan</h2>
      <p style="opacity:.7;margin:0 0 12px;">Upload gambar untuk setiap lapisan. Gambar akan tampil di materi siswa.</p>
      <div id="gambarList"></div>
    </div>
    <div class="card">
      <h2 style="margin:0 0 12px;">Preview Default</h2>
      ${earthSVG(260)}
    </div>`;
  const list=document.getElementById('gambarList');
  LAYERS.forEach(l=>{
    const div=document.createElement('div'); div.className='item';
    div.innerHTML = `<h3>${l}</h3>
      ${state.gambarBumi[l]?`<img class="thumb" src="${state.gambarBumi[l]}" alt="">`:'<div class="empty">Belum ada gambar</div>'}
      <div class="row" style="margin-top:8px;">
        <input type="file" accept="image/*" data-layer="${l}" class="imgInput">
        ${state.gambarBumi[l]?`<button class="btn btn-sm btn-red" data-clear="${l}">Hapus</button>`:''}
      </div>`;
    list.appendChild(div);
  });
  list.querySelectorAll('.imgInput').forEach(inp=>{
    inp.onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>{ state.gambarBumi[inp.dataset.layer]=r.result; save(); renderGuru(); }; r.readAsDataURL(f);
    };
  });
  list.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{ delete state.gambarBumi[b.dataset.clear]; save(); renderGuru(); });
}

function renderGuruSet(c){
  c.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 12px;">⚙️ Pengaturan</h2>
      <label class="label">PIN Guru baru</label>
      <div class="row">
        <input class="input" id="newPin" placeholder="PIN baru" style="max-width:200px;">
        <button class="btn btn-sm" id="btnPin">Ubah PIN</button>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn btn-sm btn-ghost" id="btnExport">⬇️ Export Data (JSON)</button>
        <input type="file" accept="application/json" id="importFile" style="display:none;">
        <button class="btn btn-sm btn-ghost" id="btnImport">⬆️ Import Data (JSON)</button>
      </div>
      <div class="row" style="margin-top:16px;">
        <button class="btn btn-sm btn-red" id="btnReset">🗑️ Reset Semua Data</button>
      </div>
    </div>`;
  document.getElementById('btnPin').onclick=()=>{ const v=document.getElementById('newPin').value.trim(); if(v.length<3){ alert('PIN minimal 3 karakter'); return;} state.guruPin=v; save(); alert('PIN diubah'); };
  document.getElementById('btnExport').onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='edugame-data.json'; a.click();
  };
  document.getElementById('btnImport').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); Object.assign(state,d); save(); alert('Import berhasil'); renderGuru(); }catch(err){ alert('File tidak valid'); } }; r.readAsText(f);
  };
  document.getElementById('btnReset').onclick=()=>{
    if(confirm('Reset semua data (materi, soal, gambar, progres)?')){
      Object.assign(state, JSON.parse(JSON.stringify(DEFAULT))); state.role='guru'; save(); renderGuru();
    }
  };
}

/* ============================================================
   SISWA
   ============================================================ */
let siswaTab = 'materi';
function renderSiswa(){
  app.innerHTML = `
    <div class="topbar">
      <h1>🎒 Belajar Lapisan Bumi</h1>
      <span class="badge">${escapeHtml(state.siswaName||'Siswa')}</span>
      <button class="btn btn-sm btn-ghost" id="btnLogout">Keluar</button>
    </div>
    <div class="sidebar">
      <button class="tab ${siswaTab==='game'?'active':''}" data-tab="game">🎮 Game</button>
      <button class="tab ${siswaTab==='materi'?'active':''}" data-tab="materi">📚 Materi</button>
      <button class="tab ${siswaTab==='kuis'?'active':''}" data-tab="kuis">❓ Kuis</button>
      <button class="tab ${siswaTab==='profil'?'active':''}" data-tab="profil">🏅 Profil</button>
    </div>
    <div id="siswaContent"></div>`;
  document.getElementById('btnLogout').onclick=()=>{ state.role=null; save(); render(); };
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ siswaTab=t.dataset.tab; renderSiswa(); });
  const c=document.getElementById('siswaContent');
  if(siswaTab==='game') renderSiswaGame(c);
  else if(siswaTab==='materi') renderSiswaMateri(c);
  else if(siswaTab==='kuis') renderSiswaKuis(c);
  else renderSiswaProfil(c);
}

function renderSiswaGame(c){
  c.innerHTML = `<div class="card" style="padding:0;overflow:hidden;">
    <div style="padding:12px 16px;border-bottom:2px solid #E4D5C0;">
      <h2 style="margin:0;">🎮 Game Petualangan Ke Bawah Tanah Bumi</h2>
      <p style="opacity:.7;margin:4px 0 0;font-size:.9rem;">Mainkan game lapisan bumi di bawah ini. Materi & kuis ada di tab sebelah.</p>
    </div>
    <iframe src="./index.html" style="width:100%;height:70vh;border:0;display:block;" title="Game Lapisan Bumi" loading="lazy"></iframe>
  </div>`;
}

function renderSiswaMateri(c){
  c.innerHTML = `<div class="card"><h2 style="margin:0 0 12px;">📚 Materi</h2><div id="mList"></div></div>`;
  const list=document.getElementById('mList');
  if(state.materi.length===0){ list.innerHTML='<div class="empty">Belum ada materi dari Guru. Minta Guru menambahkan materi.</div>'; return; }
  state.materi.forEach(m=>{
    const div=document.createElement('div'); div.className='item';
    const img = m.image || state.gambarBumi[m.layer] || '';
    div.innerHTML = `<h3>${escapeHtml(m.title)}</h3><p><strong>${escapeHtml(m.layer)}</strong></p><p>${escapeHtml(m.desc||'')}</p>${img?`<img class="thumb" src="${img}" alt="">`:earthSVG(200)}`;
    list.appendChild(div);
  });
}

let kuisState = null;
function renderSiswaKuis(c){
  if(!kuisState){
    c.innerHTML = `<div class="card">
      <h2 style="margin:0 0 12px;">❓ Kuis</h2>
      <p style="opacity:.7;">Pilih lapisan untuk kuis, atau semua soal.</p>
      <div class="row">
        <select class="select" id="kLayer" style="max-width:260px;">
          <option value="all">Semua Lapisan</option>
          ${LAYERS.map(l=>`<option>${l}</option>`).join('')}
        </select>
        <button class="btn btn-green" id="btnStartKuis">Mulai Kuis</button>
      </div>
      <div id="kInfo" style="margin-top:10px;opacity:.7;font-size:.9rem;">Total soal tersedia: ${state.soal.length}</div>
    </div>
    <div id="kArea"></div>`;
    document.getElementById('btnStartKuis').onclick = startKuis;
    return;
  }
  renderKuisArea(c);
}

function startKuis(){
  const layer=document.getElementById('kLayer').value;
  let pool = layer==='all' ? state.soal.slice() : state.soal.filter(s=>s.layer===layer);
  if(pool.length===0){ alert('Tidak ada soal untuk lapisan ini.'); return; }
  // shuffle
  pool.sort(()=>Math.random()-.5);
  kuisState = { idx:0, pool, score:0, answers:[] };
  renderSiswa();
}

function renderKuisArea(c){
  const area = document.getElementById('kArea') || c;
  if(!kuisState) return;
  if(kuisState.idx >= kuisState.pool.length){
    const total=kuisState.pool.length;
    const pct=Math.round(kuisState.score/total*100);
    area.innerHTML = `<div class="card" style="text-align:center;">
      <h2>🏆 Selesai!</h2>
      <div class="score">${kuisState.score} / ${total}</div>
      <p>Skor: ${pct}%</p>
      <button class="btn btn-green" id="btnKuisAgain">Ulang</button>
    </div>`;
    // save progress
    state.progress.push({name:state.siswaName, score:kuisState.score, total, date:new Date().toLocaleString('id-ID')});
    save();
    document.getElementById('btnKuisAgain').onclick=()=>{ kuisState=null; renderSiswa(); };
    return;
  }
  const q = kuisState.pool[kuisState.idx];
  const img = q.image || state.gambarBumi[q.layer] || '';
  area.innerHTML = `<div class="card">
    <p style="opacity:.7;margin:0 0 6px;">Soal ${kuisState.idx+1} dari ${kuisState.pool.length}</p>
    <h2 style="margin:0 0 10px;">${escapeHtml(q.question)}</h2>
    ${img?`<img class="thumb" src="${img}" alt="">`:''}
    <div id="kOpts" style="margin-top:12px;"></div>
  </div>`;
  const opts=document.getElementById('kOpts');
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='btn btn-ghost'; b.style.width='100%'; b.style.marginBottom='8px'; b.style.textAlign='left';
    b.textContent = `${String.fromCharCode(65+i)}. ${o}`;
    b.onclick=()=>{
      if(i===q.answer){ b.classList.remove('btn-ghost'); b.classList.add('btn-green'); kuisState.score++; }
      else { b.classList.remove('btn-ghost'); b.classList.add('btn-red'); }
      // highlight correct
      opts.querySelectorAll('button').forEach((bb,ii)=>{ bb.disabled=true; if(ii===q.answer){ bb.classList.remove('btn-ghost','btn-red'); bb.classList.add('btn-green'); } });
      setTimeout(()=>{ kuisState.idx++; renderSiswa(); }, 900);
    };
    opts.appendChild(b);
  });
}

function renderSiswaProfil(c){
  const myProg = state.progress.filter(p=>p.name===state.siswaName);
  const totalScore = myProg.reduce((a,p)=>a+p.score,0);
  c.innerHTML = `<div class="card">
    <h2 style="margin:0 0 12px;">🏅 Profil ${escapeHtml(state.siswaName)}</h2>
    <div class="grid3">
      <div class="item" style="text-align:center;"><div class="score">${myProg.length}</div><p>Sesi Kuis</p></div>
      <div class="item" style="text-align:center;"><div class="score">${totalScore}</div><p>Total Benar</p></div>
      <div class="item" style="text-align:center;"><div class="score">${state.soal.length}</div><p>Total Soal</p></div>
    </div>
    <h3 style="margin:14px 0 8px;">Riwayat</h3>
    <div id="progList"></div>
  </div>`;
  const list=document.getElementById('progList');
  if(myProg.length===0){ list.innerHTML='<div class="empty">Belum ada riwayat kuis.</div>'; return; }
  myProg.slice().reverse().forEach(p=>{
    const div=document.createElement('div'); div.className='item';
    div.innerHTML=`<p>${escapeHtml(p.date)} · ${p.score}/${p.total}</p>`;
    list.appendChild(div);
  });
}

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

render();
</script>
</body>
</html>
